name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also publish service-latest tags"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_rag_api:
        description: "Publish rag-api: auto detects changes since previous semver tag"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"

permissions:
  contents: read
  packages: read

env:
  DOCKER_IMAGE: thnhit/technhvoice

jobs:
  docker:
    name: Build And Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set build metadata
        id: meta
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest || 'true' }}
        run: node scripts/ci/resolve-docker-image-metadata.js

      - name: Determine RAG API publication
        id: rag_changes
        env:
          PUBLISH_RAG_API: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_rag_api || 'auto' }}
          CURRENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/detect-rag-api-publication.js

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for voice-bridge
        id: voice_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=voice-bridge-${{ steps.meta.outputs.short_sha }}
            type=raw,value=voice-bridge-latest,enable=${{ steps.meta.outputs.publish_latest == 'true' }}
            type=raw,value=voice-bridge-${{ steps.meta.outputs.version_tag }},enable=${{ steps.meta.outputs.version_tag != '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.voice_oci_version }}

      - name: Build and push voice-bridge
        uses: docker/build-push-action@v6
        with:
          context: ./voice-bridge
          push: true
          tags: ${{ steps.voice_meta.outputs.tags }}
          labels: ${{ steps.voice_meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version_tag || steps.meta.outputs.short_sha }}
            IMAGE_TAG=voice-bridge-${{ steps.meta.outputs.version_tag || steps.meta.outputs.short_sha }}
            GIT_SHA=${{ github.sha }}

      - name: Docker metadata for rag-api
        id: rag_meta
        if: steps.rag_changes.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=rag-api-${{ steps.meta.outputs.short_sha }}
            type=raw,value=rag-api-latest,enable=${{ steps.meta.outputs.publish_latest == 'true' }}
            type=raw,value=rag-api-${{ steps.meta.outputs.version_tag }},enable=${{ steps.meta.outputs.version_tag != '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.rag_oci_version }}

      - name: Build and push rag-api
        if: steps.rag_changes.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./rag-api
          push: true
          tags: ${{ steps.rag_meta.outputs.tags }}
          labels: ${{ steps.rag_meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version_tag || steps.meta.outputs.short_sha }}
            IMAGE_TAG=rag-api-${{ steps.meta.outputs.version_tag || steps.meta.outputs.short_sha }}
            GIT_SHA=${{ github.sha }}

      - name: Summary
        shell: bash
        env:
          RAG_PUBLISH: ${{ steps.rag_changes.outputs.publish }}
          RAG_REASON: ${{ steps.rag_changes.outputs.reason }}
          RAG_TAGS: ${{ steps.rag_meta.outputs.tags }}
        run: |
          if [[ "${RAG_PUBLISH}" == "true" ]]; then
            rag_status="published"
          else
            rag_status="skipped"
          fi
          {
            echo "## Docker Images"
            echo
            echo "Repository: \`${DOCKER_IMAGE}\`"
            echo
            echo "Voice bridge tags:"
            echo '${{ steps.voice_meta.outputs.tags }}' | sed 's/^/- /'
            echo
            echo "RAG API publication: **${rag_status}**"
            echo
            echo "Reason: \`${RAG_REASON}\`"
            if [[ "${RAG_PUBLISH}" == "true" ]]; then
              echo
              echo "RAG API tags:"
              echo "${RAG_TAGS}" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
