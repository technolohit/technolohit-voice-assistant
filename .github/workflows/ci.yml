name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Voice Assistant Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install voice-bridge dependencies
        run: npm ci
        working-directory: voice-bridge

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts voice-bridge/src voice-bridge/scripts \
            -type f -name '*.js' \
            -not -path '*/node_modules/*' \
            -print0 | xargs -0 -n1 node --check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RAG API dependencies
        run: pip install -r rag-api/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q rag-api
          find rag-api -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: RAG API static contract tests
        run: python rag-api/tests/test_contract_static.py

      - name: Voice bridge unit tests
        run: npm test
        working-directory: voice-bridge

      - name: Validate approved playbook canary artifacts
        run: npm run playbook:canary-artifact-validate
        working-directory: voice-bridge

      - name: ASR fixture eval (v1.2.1 live failure)
        run: npm run eval:asr-fixture
        working-directory: voice-bridge

      - name: Voice dialogue QA scenarios
        shell: bash
        working-directory: voice-bridge
        run: |
          set -euo pipefail
          scenarios=(
            sales_voice_agent_pitch_no_early_phone
            sales_customer_type_stt_kundenprojekt
            sales_customer_type_first_option
            sales_customer_type_own_company_plural
            sales_explanation_after_pitch
            sales_new_prospect_qualification
            sales_existing_customer_path
            v3_live_customer_type_loop
            v3_fuer_meine_firma
            v3_repeated_unclear_no_loop
            v3_rag_fail_closed_explanation
            v3_explanation_then_phone_handoff
            v3_sales_depth_before_handoff
            v3_post_completion_product_question
            v3_email_contact_closing
            v3_pricing_after_contact_capture
            v3_smart_website_pricing_before_qualification
            voice_agent_ki_assistent
            voice_agent_telefonassistent
            rueckruf_input_maps_to_phone
            no_rueckruf_output
            unclear_input
            unknown_intent
            five_products_overview
            contact_form_question
            email_contents_question
          )
          for scenario in "${scenarios[@]}"; do
            echo "Running dialogue QA scenario: ${scenario}"
            npm run qa:dialogue -- --scenario "${scenario}"
          done

      - name: Secret and artifact guard
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './voice-bridge/node_modules' -prune -o \
              -path './rag-api/.venv' -prune -o \
              \( -name '.env' -o -name '*.pyc' -o -path '*/__pycache__/*' -o -path '*/recordings/*' \) \
              -print
          )"

          if [ -n "$forbidden_files" ]; then
            echo "Forbidden local/runtime artifacts found:"
            echo "$forbidden_files"
            exit 1
          fi

          if grep -RInE 'sk-proj-|OPENAI_API_KEY=sk-|VOICE_DB_PASSWORD=[^<[:space:]$]|RAG_DB_PASSWORD=[^<[:space:]$]|DOCKERHUB_TOKEN=[^[:space:]$]|VOICE_DEPLOY_SSH_KEY=[^[:space:]$]' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=__pycache__ \
            --exclude=ci.yml \
            --exclude=deploy.yml \
            .; then
            echo "Possible secret found in repository content."
            exit 1
          fi
