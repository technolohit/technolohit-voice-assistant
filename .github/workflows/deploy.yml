name: Deploy Voice Stack

on:
  workflow_dispatch:
    inputs:
      voice_bridge_tag:
        description: "Docker tag for voice-bridge, for example voice-bridge-v1.0.0 or voice-bridge-abc1234"
        required: true
      deploy_rag_api:
        description: "Deploy rag-api too"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rag_api_tag:
        description: "Docker tag for rag-api, required only when deploy_rag_api=true"
        required: false
      verify_v3_qa_env:
        description: "After deploy, verify v3 semantic/repair env flags inside voice-bridge"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      verify_v4_rag_canary_env:
        description: "After deploy, hard-fail unless the running voice-bridge is ready for a supervised v4 RAG-on canary"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_rag_sales_answerer:
        description: "Documentation hint only - RAG sales answerer must stay false in ../voice-bridge/.env unless explicitly approved"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  DOCKER_IMAGE: thnhit/technhvoice

jobs:
  deploy:
    name: Deploy On Server
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        id: validate_inputs
        shell: bash
        run: |
          set -euo pipefail
          voice_bridge_tag="${{ inputs.voice_bridge_tag }}"
          rag_api_tag="${{ inputs.rag_api_tag }}"

          if [[ "${voice_bridge_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            voice_bridge_tag="voice-bridge-${voice_bridge_tag}"
          fi
          if [[ "${rag_api_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            rag_api_tag="rag-api-${rag_api_tag}"
          fi

          if [[ ! "${voice_bridge_tag}" =~ ^voice-bridge-[A-Za-z0-9._-]+$ ]]; then
            echo "voice_bridge_tag must be like voice-bridge-v1.2.1 or v1.2.1"
            exit 1
          fi
          if [[ "${{ inputs.deploy_rag_api }}" == "true" && ! "${rag_api_tag}" =~ ^rag-api-[A-Za-z0-9._-]+$ ]]; then
            echo "rag_api_tag must be like rag-api-v1.2.1 or v1.2.1 when deploy_rag_api=true"
            exit 1
          fi

          echo "voice_bridge_tag=${voice_bridge_tag}" >> "$GITHUB_OUTPUT"
          echo "rag_api_tag=${rag_api_tag}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/voice_deploy_key
          printf '%s\n' "${{ secrets.VOICE_DEPLOY_SSH_KEY }}" \
            | sed 's/\\n/\n/g' \
            | tr -d '\r' > ~/.ssh/voice_deploy_key
          chmod 600 ~/.ssh/voice_deploy_key
          ssh-keyscan -H "${{ secrets.VOICE_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy voice-bridge
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.VOICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VOICE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.VOICE_DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VOICE_BRIDGE_IMAGE: thnhit/technhvoice:${{ steps.validate_inputs.outputs.voice_bridge_tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/voice_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' DEPLOY_PATH='${DEPLOY_PATH}' VOICE_BRIDGE_IMAGE='${VOICE_BRIDGE_IMAGE}' bash -se" <<'REMOTE'
          set -euo pipefail
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          cd "$DEPLOY_PATH"
          VOICE_BRIDGE_IMAGE="$VOICE_BRIDGE_IMAGE" docker compose -f docker-compose.yml -f docker-compose.prod.yml pull voice-bridge
          VOICE_BRIDGE_IMAGE="$VOICE_BRIDGE_IMAGE" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d voice-bridge
          docker inspect technolohit-voice-bridge --format 'running_image={{.Config.Image}}'
          docker logs --tail=80 technolohit-voice-bridge
          REMOTE

      - name: Verify voice-bridge image and v3 env
        if: ${{ inputs.verify_v3_qa_env == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.VOICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VOICE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.VOICE_DEPLOY_PATH }}
          EXPECTED_IMAGE: thnhit/technhvoice:${{ steps.validate_inputs.outputs.voice_bridge_tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/voice_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "EXPECTED_IMAGE='${EXPECTED_IMAGE}' DEPLOY_PATH='${DEPLOY_PATH}' bash -se" <<'REMOTE'
          set -euo pipefail
          running="$(docker inspect technolohit-voice-bridge --format '{{.Config.Image}}')"
          echo "running_image=${running}"
          if [[ "${running}" != "${EXPECTED_IMAGE}" ]]; then
            echo "ERROR: running image ${running} != expected ${EXPECTED_IMAGE}"
            echo "Pin the image through the deploy input/VOICE_BRIDGE_IMAGE or the compose interpolation env, then redeploy voice-bridge."
            echo "Runtime v3 flags belong in: ${DEPLOY_PATH}/../voice-bridge/.env"
            exit 1
          fi
          missing=0
          check_var() {
            local name="$1"
            local expected="$2"
            local actual
            actual="$(docker exec technolohit-voice-bridge sh -lc "printenv ${name}" 2>/dev/null || true)"
            echo "${name}=${actual:-<unset>}"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "ERROR: ${name} expected '${expected}' but got '${actual:-<unset>}'"
              missing=1
            fi
          }
          check_var VOICE_SEMANTIC_INTENT_ENABLED true
          check_var VOICE_CONVERSATION_REPAIR_ENABLED true
          check_var VOICE_SEMANTIC_INTENT_MODE deterministic
          check_var VOICE_RAG_ENABLED false
          check_var VOICE_RAG_SALES_ANSWERER_ENABLED false
          check_var VOICE_RAG_QA_MODE false
          check_var VOICE_LEAD_POLICY_STRICT_CALLBACK true
          check_var VOICE_LOG_TRANSCRIPT_PREVIEW false
          if [[ "${missing}" -ne 0 ]]; then
            echo ""
            echo "Set flags in: ${DEPLOY_PATH}/../voice-bridge/.env (see docs/voice-bridge-runtime-env.md)"
            exit 1
          fi
          echo "v3 QA env verification passed."
          REMOTE

      - name: Verify v4 RAG-on canary env
        if: ${{ inputs.verify_v4_rag_canary_env == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.VOICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VOICE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.VOICE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/voice_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -se" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/technolohit-voice/asterisk}"
          AUTHORITATIVE_ENV="${DEPLOY_PATH}/../voice-bridge/.env"
          COMPOSE_PROJECT_ENV="${DEPLOY_PATH}/.env"
          RAW_COMPOSE_BASE="${DEPLOY_PATH}/docker-compose.yml"
          RAW_COMPOSE_PROD="${DEPLOY_PATH}/docker-compose.prod.yml"
          CONTAINER_NAME="technolohit-voice-bridge"
          TMP_DIR="$(mktemp -d)"
          GATE3_KEYS=(
            VOICE_RUNTIME_VERSION
            VOICE_V4_REALTIME_ENABLED
            VOICE_V4_CANARY_ENABLED
            VOICE_V4_LIVE_AUDIOSOCKET_ENABLED
            VOICE_RAG_ENABLED
            VOICE_RAG_SALES_ANSWERER_ENABLED
            VOICE_RAG_API_URL
          )
          cleanup() { rm -rf "$TMP_DIR"; }
          trap cleanup EXIT
          fail() {
            echo "compose_runtime_preflight=fail"
            echo "failure_count=1"
            echo "failures=$1"
            exit 1
          }
          write_snapshot_from_env_file() {
            local src="$1" dst="$2" key line
            : >"$dst"
            for key in "${GATE3_KEYS[@]}"; do
              line="$(grep -E "^${key}=" "$src" 2>/dev/null | tail -n 1 || true)"
              if [ -n "$line" ]; then printf '%s\n' "$line" >>"$dst"; fi
            done
            chmod 600 "$dst"
          }
          write_snapshot_from_compose_config() {
            local src="$1" dst="$2" key value
            : >"$dst"
            for key in "${GATE3_KEYS[@]}"; do
              value="$(awk -v key="$key" '
                $0 ~ /^  voice-bridge:/ { in_voice = 1; next }
                in_voice && /^  [A-Za-z0-9_.-]+:/ && $0 !~ /^  voice-bridge:/ { exit }
                in_voice && index($0, "      " key ":") == 1 {
                  sub(/^[^:]*:[[:space:]]*/, "", $0)
                  gsub(/^["'\''"]|["'\''"]$/, "", $0)
                  print $0
                  exit
                }
              ' "$src")"
              if [ -n "$value" ]; then printf '%s=%s\n' "$key" "$value" >>"$dst"; fi
            done
            chmod 600 "$dst"
          }
          write_snapshot_from_container() {
            local dst="$1" key
            : >"$dst"
            for key in "${GATE3_KEYS[@]}"; do
              docker exec "$CONTAINER_NAME" sh -lc "printf '%s=%s\n' '$key' \"\${$key:-}\"" >>"$dst"
            done
            chmod 600 "$dst"
          }
          write_compose_project_env_keys() {
            local src="$1" dst="$2"
            if [ ! -f "$src" ]; then : >"$dst"; else
              awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print $1 }' "$src" >"$dst"
            fi
            chmod 600 "$dst"
          }
          [ -f "$AUTHORITATIVE_ENV" ] || fail "authoritative_env_missing"
          [ -f "$RAW_COMPOSE_BASE" ] || fail "raw_compose_missing:docker-compose.yml"
          [ -f "$RAW_COMPOSE_PROD" ] || fail "raw_compose_missing:docker-compose.prod.yml"
          docker inspect "$CONTAINER_NAME" >/dev/null 2>&1 || fail "container_missing"
          RUNNING_IMAGE="$(docker inspect "$CONTAINER_NAME" --format '{{.Config.Image}}')"
          AUTHORITATIVE_SNAPSHOT="${TMP_DIR}/authoritative-snapshot.env"
          COMPOSE_RENDERED="${TMP_DIR}/compose-rendered.yml"
          COMPOSE_SNAPSHOT="${TMP_DIR}/compose-snapshot.env"
          CONTAINER_SNAPSHOT="${TMP_DIR}/container-snapshot.env"
          PROJECT_ENV_KEYS="${TMP_DIR}/compose-project-env-keys.txt"
          (
            cd "$DEPLOY_PATH"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config >"$COMPOSE_RENDERED"
          )
          write_snapshot_from_env_file "$AUTHORITATIVE_ENV" "$AUTHORITATIVE_SNAPSHOT"
          write_snapshot_from_compose_config "$COMPOSE_RENDERED" "$COMPOSE_SNAPSHOT"
          write_snapshot_from_container "$CONTAINER_SNAPSHOT"
          write_compose_project_env_keys "$COMPOSE_PROJECT_ENV" "$PROJECT_ENV_KEYS"
          docker run --rm --user 0:0 \
            -v "${AUTHORITATIVE_SNAPSHOT}:/authoritative.env:ro" \
            -v "${COMPOSE_SNAPSHOT}:/compose-config.env:ro" \
            -v "${CONTAINER_SNAPSHOT}:/container-env.env:ro" \
            -v "${RAW_COMPOSE_BASE}:/raw/docker-compose.yml:ro" \
            -v "${RAW_COMPOSE_PROD}:/raw/docker-compose.prod.yml:ro" \
            -v "${PROJECT_ENV_KEYS}:/compose-project-env-keys.txt:ro" \
            "$RUNNING_IMAGE" \
            node scripts/compose-runtime-preflight.js \
              --gate3 \
              --authoritative-file /authoritative.env \
              --compose-config-file /compose-config.env \
              --container-env-file /container-env.env \
              --raw-compose-file /raw/docker-compose.yml \
              --raw-compose-file /raw/docker-compose.prod.yml \
              --compose-project-env-keys-file /compose-project-env-keys.txt
          docker exec technolohit-voice-bridge npm run rag:canary-preflight
          echo "v4 RAG-on canary env verification passed."
          REMOTE

      - name: Deploy rag-api
        if: ${{ inputs.deploy_rag_api == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.VOICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VOICE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.VOICE_DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RAG_API_IMAGE: thnhit/technhvoice:${{ steps.validate_inputs.outputs.rag_api_tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/voice_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' DEPLOY_PATH='${DEPLOY_PATH}' RAG_API_IMAGE='${RAG_API_IMAGE}' bash -se" <<'REMOTE'
          set -euo pipefail
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          cd "$DEPLOY_PATH"
          RAG_API_IMAGE="$RAG_API_IMAGE" docker compose -f docker-compose.yml -f docker-compose.prod.yml pull technolohit-rag-api
          RAG_API_IMAGE="$RAG_API_IMAGE" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d technolohit-rag-api
          docker inspect technolohit-rag-api --format 'running_image={{.Config.Image}}'
          docker logs --tail=80 technolohit-rag-api
          REMOTE

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Deploy Request"
            echo
            echo "- voice-bridge: \`${DOCKER_IMAGE}:${{ steps.validate_inputs.outputs.voice_bridge_tag }}\`"
            echo "- deploy rag-api: \`${{ inputs.deploy_rag_api }}\`"
            if [[ "${{ inputs.deploy_rag_api }}" == "true" ]]; then
              echo "- rag-api: \`${DOCKER_IMAGE}:${{ steps.validate_inputs.outputs.rag_api_tag }}\`"
            fi
            echo "- verify v3 QA env: \`${{ inputs.verify_v3_qa_env }}\`"
            echo "- verify v4 RAG-on canary env: \`${{ inputs.verify_v4_rag_canary_env }}\`"
            echo "- RAG sales answerer (must stay off unless approved): \`${{ inputs.enable_rag_sales_answerer }}\`"
            echo "- voice-bridge env source of truth: \`../voice-bridge/.env\` on server (see docs/voice-bridge-runtime-env.md)"
          } >> "$GITHUB_STEP_SUMMARY"
