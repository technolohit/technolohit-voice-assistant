;
; TechnoloHit Asterisk module policy
;
; Keep autoload enabled so required modules and dependencies can still load.
; Explicitly noload unused/noisy modules to avoid false monitoring alerts from
; startup ERROR/WARNING lines.
;
; Required voice path modules must NOT be disabled here:
; app_audiosocket.so, chan_audiosocket.so, res_audiosocket.so
; chan_pjsip.so, res_pjsip.so, res_pjsip_outbound_registration.so
; res_pjsip_session.so, pbx_config.so, format_sln.so
; codec_alaw.so, codec_ulaw.so, codec_slin.so, res_resample.so
;

[modules]
autoload=yes

; Additional production-noisy modules observed in Asterisk startup logs.
noload => cel_pgsql.so
noload => app_voicemail_imap.so
noload => res_pjsip_phoneprov_provider.so

; SQLite CDR/CEL backends are unused.
noload => cdr_sqlite.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so

; PostgreSQL CDR/CEL/realtime backends are unused by the voice bridge.
noload => cdr_pgsql.so
noload => res_config_pgsql.so

; LDAP realtime is unused.
noload => res_config_ldap.so

; HEP/Homer telemetry is unused.
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

; ARI/Stasis is unused for the Easybell -> AudioSocket voice path.
noload => app_stasis.so
noload => res_ari.so
noload => res_ari_applications.so
noload => res_ari_asterisk.so
noload => res_ari_bridges.so
noload => res_ari_channels.so
noload => res_ari_device_states.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_ari_model.so
noload => res_ari_playbacks.so
noload => res_ari_recordings.so
noload => res_ari_sounds.so
noload => res_stasis.so
noload => res_stasis_answer.so
noload => res_stasis_device_state.so
noload => res_stasis_mailbox.so
noload => res_stasis_playback.so
noload => res_stasis_recording.so
noload => res_stasis_snoop.so

; JACK/console channels are unused in production.
noload => app_jack.so
noload => chan_console.so

; Legacy/unused channel drivers.
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_motif.so

; Voicemail/minivm/ADSI/demo modules are unused.
noload => app_voicemail.so
noload => app_minivm.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => app_ivrdemo.so
noload => app_skel.so

; Fax modules are unused.
noload => app_fax.so
noload => res_fax.so
noload => res_fax_spandsp.so

; Calendar integrations are unused.
noload => res_calendar.so
noload => res_calendar_caldav.so
noload => res_calendar_ews.so
noload => res_calendar_exchange.so
noload => res_calendar_icalendar.so

; XMPP/Jabber integrations are unused.
noload => res_xmpp.so
noload => res_jabber.so

; SNMP is unused.
noload => res_snmp.so

; Phone provisioning is unused.
noload => res_phoneprov.so
